name: CI (experiments nightly)

on:
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch --extra-index-url https://pypi.org/simple
          pip install -e .[llm_code_compiler] pytest
      - name: Run all experiments tests
        run: |
          python CLIs/pytest_all_experiments.py --pytest-args -q || true
      - name: Always succeed but surface failures in logs
        run: echo "Nightly experiment run complete"


