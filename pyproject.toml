[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-lab"
version = "0.1.0"
description = "A repository for modular, testable, and reproducible ML research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GPT-Lab" }]
dependencies = [
    "torch",
    "numpy",
    "pyyaml",
    "tqdm",
    "pandas",
]

[project.optional-dependencies]
docs = ["mkdocs"]
viz = ["plotly", "matplotlib"]
notebooks = ["marimo"]
llm_code_compiler = ["litellm"]
data_sources = [
    "huggingface_hub",
    "datasets",
    "tiktoken",
]
nn_modules = [
    "triton; sys_platform != 'darwin'",  # Skip triton on macOS
]
optimizers = [
    "muon",
]
train_loops = []
benchmarks = []
all_catalogs = [
    "gpt-lab[data_sources]",
    "gpt-lab[nn_modules]",
    "gpt-lab[optimizers]",
    "gpt-lab[train_loops]",
    "gpt-lab[llm_code_compiler]",
    "gpt-lab[benchmarks]",
]
# Domain packs (optional)
nlp = [
    "datasets",
    "tiktoken",
]
cv = []
dev = [
    "gpt-lab[all_catalogs]",
    "gpt-lab[nlp]",
    "gpt-lab[cv]",
    "gpt-lab[docs]",
    "gpt-lab[viz]",
    "gpt-lab[notebooks]",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = [
    "src/gpt_lab",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:Use 'content=<...>' to upload raw bytes/text content.:DeprecationWarning",
    "ignore:Pydantic serializer warnings:UserWarning",
]

[tool.setuptools]

[tool.setuptools.packages.find]
# Tell setuptools to look for packages inside the 'src' directory.
where = ["src"]
