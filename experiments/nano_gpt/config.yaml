experiment_name: "nanogpt-gpt2-small"
seed: 1337

model:
  max_seq_len: 1024
  vocab_size: 50257 # GPT-2 vocab size
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  bias: True

data:
  batch_size: 8

optimizer:
  # Note: learning_rate is now under training kwargs for the scheduler feature
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

training:
  # kwargs related to training that are directly used in main.py
  device: "cuda"
  learning_rate: .0006 # This will be the max_lr
  warmup_iters: 2000
  lr_decay_iters: 600000
  min_lr: .00006
  #resume_from_checkpoint: null

  atomic_feature_kwargs:
    # kwargs that'll trigger atomic features
    max_steps: 600000
    accum_steps: 40
    lr_scheduler_type: 'lambda_lr'
    norm_clip_value: 1.0
    val_interval: 2000
    save_every_steps: 2000
    save_best_model: True
    track_loss: True




# Benchmarking and generation after training
benchmarks:
  run_benchmarks: True
  hellaswag_limit: 500
  wikiqa_limit: 500
  asdiv_limit: 500
generation:
  max_new_tokens: 32
  temperature: 0.8
  top_k: 200
